# Clause index. The text of every clause is cut from policies/sources/ by policies/library.py,
# so a quote of a clause is always a verbatim quote of its source file.
#
# locator kinds
#   article: "第十三条"                 the whole article (until the next article or chapter heading)
#   article_item: ["第九条", "（三）"]   one numbered item inside an article
#   article_para: ["第十一条", 2]         one paragraph (line) of an article, 1-based
#   guide_item: "六、"                   one numbered item of the SAMR guide, with its sub-items
#   section: "Misleading claims"          one "## " section of a TikTok page (until the next "## ")
#
# category: the violation type the clause is about. "other" clauses are in the library so that
# retrieval has wrong answers to choose from; no test item is labelled with them.
# kind: rule (a prohibition or requirement) or guidance (when a rule does not apply).

