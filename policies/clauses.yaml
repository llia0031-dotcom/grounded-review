# Violation types used in the test set. Each label in the test set names one category and the
# clause ids that count as a correct citation for it.
categories:
  ABSOLUTE: {zh: 绝对化用语（最、第一、顶级等）, en: "Absolute or superlative claims about the product (best, No. 1, strongest)"}
  MEDICAL: {zh: 非医疗商品宣称预防、治疗疾病，或保健食品的功效、疾病宣称, en: "Claims that a product prevents, treats or cures a disease"}
  GUARANTEE: {zh: 对考试、收益、效果作保证性承诺, en: "Promised or guaranteed outcomes: exam results, investment returns, income, product effects"}
  DISPARAGE: {zh: 贬低其他经营者的商品或服务, en: "Running down other businesses' products or services"}
  DATA: {zh: 数据、统计、调查结果、引用语未表明出处, en: "Data, statistics, survey results or quotations without a stated source"}
  ALCOHOL: {zh: 酒类广告的禁止内容, en: "Alcohol ads: encouraging drinking, drinking shown, claimed benefits, alcohol as a prize, missing required statements"}
  WEIGHT: {zh: 减重、体型相关的宣称, en: "Weight-loss, muscle-gain and body-image claims"}
  BEFORE_AFTER: {zh: 使用前后效果对比, en: "Before-and-after comparisons of product results"}
  FLAG: {zh: 国旗、国歌、国徽、军旗等, en: "National flag, anthem or emblem, military flag"}

