# Memory test, Chinese (split: memory). Written 2026-11-16 together with precedents.yaml, before any model saw them.
# Answers fixed at writing. Brands are fictional. Text ads only.
# precedent: the earlier decision this ad was written against (precedents.yaml). relation: follow = the right call
# matches that precedent; distinguish = it does not (the precedent should not be applied).
# type: follow-reject, follow-approve (a grey case the earlier decision settles), fixed (the advertiser fixed the
# problem), qualified (similar words, now with the qualifiers that make them lawful), history (a clean ad from an
# advertiser with rejected ads), dropped (the qualifiers that made an approved ad lawful are gone), new-violation
# (an approved ad with a violation added).
