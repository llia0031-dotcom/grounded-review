# The memory store for the memory test (split: memory): earlier decisions on ads, as a platform would keep them once a
# decision is confirmed. Written 2026-11-16 together with items_memory_*.yaml, before any model saw them; decisions and
# reasons fixed at writing. Brands are fictional.
# The agent only reads this store (agent/memory.py); nothing in a review writes to it.
# pair: the test item this record was written for (for scoring only, never shown to the model); records without a
# pair are other decisions in the store.
# Fields: id, lang, advertiser, date, copy, decision, violations [{cat, clause, quote}], reason.

