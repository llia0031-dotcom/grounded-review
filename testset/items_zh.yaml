# Chinese ads. Brands are fictional. Answers fixed when the items were written.
# kind: text = caption only; image = caption + a rendered image (image.lines are the words in the image).
# labels: one per violation. span = the exact words in the ad that break the rule;
#   visual = the violation is in the picture, not in words.
# trap: why an item that looks like a violation is compliant, with the clause that says so (basis).
# revision: a later version the advertiser submits (multi-turn task), with its own labels.
# must_keep: facts an edited version has to keep.

