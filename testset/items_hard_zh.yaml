- id: zh-h03
  split: hard
  kind: text
  copy: 「木朴」实木书桌新品上架。我们的客服团队最用心，下单后 2 小时内回电确认尺寸。桌面用北美白橡木，边角做了圆角处理，适合有孩子的家庭。本店 2026 年 10 月天猫木作书桌类目销量第一（数据来源：天猫生意参谋，2026 年 10 月）。1.2 米款 ¥1580，1.4 米款 ¥1880。
  labels: []
  trap: “最用心”说的是客服态度，不指向商品；“销量第一”限定了平台、类目和月份，并写明了数据来源。
  basis: [CN-SAMR-5, CN-SAMR-6]
