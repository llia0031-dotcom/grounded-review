  kind: text
  copy: 「青禾」空气炸锅双十一返场：5.5L 大容量，可视窗口随时看火候，一键 8 种菜单，新手也不翻车。很多宝子问和上一代比有什么不同——这一代加了双热管，受热更均匀，是全网口碑最好的空气炸锅，没有之一。到手价 ¥299，再送硅胶垫和食谱。
  labels:
    - {cat: ABSOLUTE, clauses: [CN-AL-9-3], span: 是全网口碑最好的空气炸锅，没有之一}
- id: zh-h02
  split: hard
  kind: text
  copy: 「澄心」益生菌固体饮料，原味和蓝莓两种口味。上周有位妈妈留言：孩子喝了两个月，过敏性鼻炎再也没犯过。我们不敢说多神奇，但 97% 的老顾客都会回购。冲泡方便，40℃ 以下温水即可，早晚各一条。30 条装 ¥168。
  labels:
    - {cat: MEDICAL, clauses: [CN-AL-17], span: 孩子喝了两个月，过敏性鼻炎再也没犯过}
