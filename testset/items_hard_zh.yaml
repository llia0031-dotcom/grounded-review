# Harder Chinese ads (split: hard). Written 2026-11-14 after the test run, before any model saw them.
# Longer captions with the violation in the middle, three-frame short-video screenshots (subtitles in the frames),
# implied claims, and traps whose risky words are allowed. Brands are fictional. Answers fixed at writing.
- id: zh-h01
